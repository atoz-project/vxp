title: VXP
description: Vulnerability Validation Guide — 漏洞验证指南
lang: zh-CN
url: "https://atoz-project.github.io"
baseurl: "/vxp"
repository: atoz-project/vxp
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-optional-front-matter
  - jekyll-default-layout
  - jekyll-titles-from-headings
relative_links:
  enabled: true
  collections: true
exclude:
  - .stitch
  - README.md
  - bin
  - tests
